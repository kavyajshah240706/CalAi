name: CalAi Continuous Deployment

on:
  push:
    branches:
      - main # This pipeline will trigger every time you push to the 'main' branch

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Assuming you cloned your repo into a folder called 'CalAi' on your server
          script: |
            cd ~/CalAi
            git pull origin main
            
            # Rebuild the backend and volume estimator to capture new code changes
            docker-compose build backend volume_estimator
            
            # Restart the containers in detached mode. Existing unchanged containers (like DB) won't drop!
            docker-compose up -d
            
            # Clean up old unused docker images to save disk space
            docker image prune -f
